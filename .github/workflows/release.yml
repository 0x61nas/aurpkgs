name: build-arch-packages

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Pacman packages
        uses: actions/cache@v5
        with:
          path: /var/cache/pacman/pkg
          key: pacman-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pacman-cache-${{ runner.os }}-

      - name: Cache Makepkg sources
        uses: actions/cache@v5
        with:
          path: /srcdest
          key: makepkg-src-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            makepkg-src-${{ runner.os }}-

      - name: Install dependencies & configure environment
        run: |
          pacman -Syu --noconfirm --needed base-devel git
          
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          mkdir -p /srcdest /pkgdest
          chown -R builder:builder . /srcdest /pkgdest
          
          sed -i "s/#MAKEFLAGS=\"-j2\"/MAKEFLAGS=\"-j$(nproc)\"/g" /etc/makepkg.conf
          sed -i "s|#SRCDEST=/home/sources.*|SRCDEST=/srcdest|g" /etc/makepkg.conf
          sed -i "s|#PKGDEST=/home/packages.*|PKGDEST=/pkgdest|g" /etc/makepkg.conf
          sed -i "s/COMPRESSZST=(zstd -c -T0 --ultra -20 -)/COMPRESSZST=(zstd -c -T0 -)/g" /etc/makepkg.conf

      - name: Build packages
        run: |
          su builder -c '
            shopt -s nullglob
            for dir in */; do
              case "$dir" in
                  .git/|.github/|.templates/) continue ;;
              esac
              if [ -f "$dir/PKGBUILD" ]; then
                cd "$dir"
                makepkg -s --noconfirm --needed
                cd ..
              fi
            done
          '

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: /pkgdest/*.pkg.tar.*
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
